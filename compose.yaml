# Optional local backend dependencies. The mobile app never needs Docker, and the API runs without it
# (in-memory PGlite). Use this when you want a persistent, real Postgres: `npm run db:up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nano_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-nano}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
