<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Profile" back-label="Account" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 24px;">
<x-import component-from-global-scope="NanoBeauty.TextField" label="First name" value="Maria"></x-import>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Last name" value="Chen"></x-import>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Mobile number" icon="phone" value="{{phoneVal}}" helper="{{phoneHelp}}" disabled="{{no}}"></x-import>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Email" optional="{{yes}}" value="maria@example.com"></x-import>
<sc-if value="{{state_error}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.Banner" tone="danger" title="We couldn’t save">Your changes are still here. Check your connection and try again.</x-import>
</sc-if>
<x-import component-from-global-scope="NanoBeauty.Banner" tone="info">We only ask for what we need to book you. No medical details are stored in the app.</x-import>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0;">
<a href="ACC-01.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}">{{saveLabel}}</x-import></a>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"state":{"editor": "enum", "options": ["view", "phone", "error"], "default": "view"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'view';
return { saveLabel: (this.props.state ?? 'view') === 'phone' ? 'Send code to new number' : ((this.props.state ?? 'view') === 'error' ? 'Try again' : 'Save changes'), theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, no: false, state, state_view: state === 'view', state_phone: state === 'phone', state_error: state === 'error', phoneVal: state === 'phone' ? '(778) 555-0199' : '(604) 555-0123', phoneHelp: state === 'phone' ? 'We’ll text a code to this new number before saving.' : 'Changing it sends a new code to the new number.' };
}
}
</script>
</body>
</html>
