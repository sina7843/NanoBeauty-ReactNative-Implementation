<x-import component-from-global-scope="NanoBeauty.TopBar" title="Book" back-label="Time" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 16px;">

</div>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="BKG-05.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}">Continue</x-import></a>
</div>
<div style="height: 34px;"></div>
</div>
</div>

return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, state, state_ready: state === 'ready', state_error: state === 'error', step: 3, s16: 16, agreed: state === 'ready', policyError: state === 'error' ? 'Please agree to the policy to continue' : undefined };

}
