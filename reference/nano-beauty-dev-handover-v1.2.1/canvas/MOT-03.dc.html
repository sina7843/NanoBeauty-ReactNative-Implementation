<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion: booking confirmation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px;">
<div style="display: flex; justify-content: space-between; align-items: center;"><span class="overline" style="color: var(--ink-muted);">Motion · Booking confirmation</span><x-import component-from-global-scope="NanoBeauty.Badge" tone="neutral" icon="info">{{modeLabel}}</x-import></div>
<sc-if value="{{before}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.BookingSummary" rows="{{rows}}" total="{{total}}" due-later="{{later}}" due-now="{{now}}" policy="Nothing is booked until the clinic’s system confirms."></x-import>
</sc-if>
<sc-if value="{{ok}}" hint-placeholder-val="{{true}}">
<div style="{{resStyle}}"><x-import component-from-global-scope="NanoBeauty.AsyncStatus" state="success" title="You’re booked" reference="NB-20418">Thu 16 Oct at 2:30 pm with Nazanin (Naz).</x-import></div>
</sc-if>
<sc-if value="{{fail}}" hint-placeholder-val="{{true}}">
<div style="{{resStyle}}"><x-import component-from-global-scope="NanoBeauty.AsyncStatus" state="failed" title="We couldn’t book that time">The time was taken before we could confirm. Nothing was charged.</x-import></div>
</sc-if>
<sc-if value="{{before}}" hint-placeholder-val="{{true}}">
<div><x-import component-from-global-scope="NanoBeauty.Chip" selected="{{sim}}" on-click="{{toggleSim}}" icon="warning-circle">Simulate: booking system says no</x-import></div>
</sc-if>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}" loading="{{busy}}" loading-label="Confirming…" on-click="{{go}}">{{cta}}</x-import>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "motion": {"editor": "enum", "options": ["normal", "reduced"], "default": "normal"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {

  componentWillUnmount() { (this._t || []).forEach(clearTimeout); if (this._i) clearInterval(this._i); }
  later(fn, ms) { this._t = this._t || []; this._t.push(setTimeout(fn, ms)); }
  reduced() { return (this.props.motion ?? 'normal') === 'reduced'; }
  // enter transition for a block that just appeared: start hidden, then settle
  reveal(key) { this.setState({ [key]: false }); this.later(() => this.setState({ [key]: true }), 30); }
  enterStyle(on, dur) {
    const r = this.reduced();
    const tr = r ? 'opacity var(--duration-reduced) linear' : `opacity var(--duration-${dur || 'reveal'}) var(--ease-enter), transform var(--duration-${dur || 'reveal'}) var(--ease-enter)`;
    const tf = r || on ? 'none' : 'translateY(8px)';
    return `opacity: ${on ? 1 : 0}; transform: ${tf}; transition: ${tr};`;
  }
  base() { return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, no: false, s16: 16, modeLabel: this.reduced() ? 'Reduce Motion on' : 'Normal motion' }; }

  constructor(props) { super(props); this.state = { status: 'idle', sim: false, resOn: true }; }
  renderVals() {
    const st = this.state.status;
    return { ...this.base(), before: st === 'idle' || st === 'pending', ok: st === 'ok', fail: st === 'fail', busy: st === 'pending', sim: this.state.sim,
      rows: [{ label: 'Treatment', value: '12D HIFU · Full face' }, { label: 'When', value: 'Thu 16 Oct, 2:30 pm' }, { label: 'With', value: 'Nazanin (Naz)' }, { label: 'Package', value: 'Uses 1 of 4 sessions' }],
      total: undefined, later: undefined, now: undefined,
      cta: st === 'ok' || st === 'fail' ? 'Start over' : 'Confirm booking',
      resStyle: this.enterStyle(this.state.resOn),
      toggleSim: () => this.setState({ sim: !this.state.sim }),
      go: () => { if (st === 'ok' || st === 'fail') { this.setState({ status: 'idle' }); return; }
        if (st === 'pending') return; this.setState({ status: 'pending' });
        this.later(() => { this.setState({ status: this.state.sim ? 'fail' : 'ok' }); this.reveal('resOn'); }, 1400); } };
  }
}
</script>
</body>
</html>
