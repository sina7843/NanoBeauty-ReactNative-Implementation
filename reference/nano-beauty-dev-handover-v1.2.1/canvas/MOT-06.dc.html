<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion: offer expiry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px;">
<div style="display: flex; justify-content: space-between; align-items: center;"><span class="overline" style="color: var(--ink-muted);">Motion · Offer expiry</span><x-import component-from-global-scope="NanoBeauty.Badge" tone="neutral" icon="info">{{modeLabel}}</x-import></div>
<sc-if value="{{live}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.OfferCard" photo="/_blob/97c35b0f4397d4f6ef8456f69c69ad9a" eyebrow="Autumn offer" title="15% off laser packages" ends-at="{{endsLabel}}"></x-import>
</sc-if>
<sc-if value="{{ended}}" hint-placeholder-val="{{true}}">
<div style="{{resStyle}}; display: flex; flex-direction: column; gap: 12px;"><x-import component-from-global-scope="NanoBeauty.Banner" tone="info" title="This offer has ended">It ended at 11:59 pm PT. Laser treatments are still available at the regular price.</x-import>
<x-import component-from-global-scope="NanoBeauty.OfferCard" photo="/_blob/97c35b0f4397d4f6ef8456f69c69ad9a" eyebrow="Autumn offer" title="15% off laser packages" ends-at="31 Oct, 11:59 pm PT" state="expired"></x-import></div>
</sc-if>
<p class="caption" style="margin: 0; color: var(--ink-muted);">The time left is plain text from server time. It never flashes, and nothing moves on its own.</p>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}" variant="secondary" icon="arrow-clockwise" on-click="{{replay}}">Replay</x-import>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "motion": {"editor": "enum", "options": ["normal", "reduced"], "default": "normal"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {

  componentWillUnmount() { (this._t || []).forEach(clearTimeout); if (this._i) clearInterval(this._i); }
  later(fn, ms) { this._t = this._t || []; this._t.push(setTimeout(fn, ms)); }
  reduced() { return (this.props.motion ?? 'normal') === 'reduced'; }
  // enter transition for a block that just appeared: start hidden, then settle
  reveal(key) { this.setState({ [key]: false }); this.later(() => this.setState({ [key]: true }), 30); }
  enterStyle(on, dur) {
    const r = this.reduced();
    const tr = r ? 'opacity var(--duration-reduced) linear' : `opacity var(--duration-${dur || 'reveal'}) var(--ease-enter), transform var(--duration-${dur || 'reveal'}) var(--ease-enter)`;
    const tf = r || on ? 'none' : 'translateY(8px)';
    return `opacity: ${on ? 1 : 0}; transform: ${tf}; transition: ${tr};`;
  }
  base() { return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, no: false, s16: 16, modeLabel: this.reduced() ? 'Reduce Motion on' : 'Normal motion' }; }

  constructor(props) { super(props); this.state = { left: 8, resOn: true }; }
  componentDidMount() { this.tick(); }
  tick() { if (this._i) clearInterval(this._i); this._i = setInterval(() => { const n = this.state.left - 1; this.setState({ left: n }); if (n <= 0) { clearInterval(this._i); this.reveal('resOn'); } }, 1000); }
  renderVals() {
    const l = Math.max(0, this.state.left);
    return { ...this.base(), live: l > 0, ended: l <= 0, endsLabel: 'today, 11:59 pm PT · ' + l + ' s left (demo)', resStyle: this.enterStyle(this.state.resOn),
      replay: () => { this.setState({ left: 8 }); this.tick(); } };
  }
}
</script>
</body>
</html>
