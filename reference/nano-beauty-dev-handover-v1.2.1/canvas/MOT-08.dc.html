<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion: sheet dismissal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Visit" back-label="Visits" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px;">
<div style="display: flex; justify-content: space-between; align-items: center;"><span class="overline" style="color: var(--ink-muted);">Motion · Sheet dismissal</span><x-import component-from-global-scope="NanoBeauty.Badge" tone="neutral" icon="info">{{modeLabel}}</x-import></div>
<x-import component-from-global-scope="NanoBeauty.AppointmentPass" service="12D HIFU" date="Thu 16 Oct" time="2:30 pm" provider="Nazanin (Naz)" sample="{{yes}}" eyebrow="Your visit"></x-import>
<x-import component-from-global-scope="NanoBeauty.Button" variant="secondary" full-width="{{yes}}" icon="pencil-simple" on-click="{{open}}">Add a note for the clinic</x-import>
<p class="caption" style="margin: 0; color: var(--ink-muted);">Close the sheet with Close or by tapping outside. If you typed something, we ask before throwing it away.</p>
</div>
<div style="height: 34px; flex-shrink: 0;"></div>
<sc-if value="{{mounted}}" hint-placeholder-val="{{false}}">
<div onClick="{{scrimTap}}" style="position: absolute; inset: 0; background: var(--scrim); {{scrimStyle}}"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; {{sheetStyle}}"><x-import component-from-global-scope="NanoBeauty.Sheet" title="Note for the clinic" on-close="{{noX}}"><x-import component-from-global-scope="NanoBeauty.TextField" label="Note" placeholder="e.g. I may be 5 minutes late" on-change="{{typed}}"></x-import>
<x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}" on-click="{{save}}">Save note</x-import>
<x-import component-from-global-scope="NanoBeauty.Button" variant="tertiary" full-width="{{yes}}" on-click="{{scrimTap}}">Close</x-import></x-import><div style="height: 34px; background: var(--surface-raised);"></div></div>
</sc-if>
<sc-if value="{{asking}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 20px; background: var(--scrim);"><div class="nb-dialog" role="alertdialog" aria-label="Discard your note?" style="{{dlgStyle}}"><h2 class="headline" style="margin: 0;">Discard your note?</h2><p class="body nb-muted" style="margin: 0;">Your note hasn’t been saved.</p><div class="nb-dialog__actions"><x-import component-from-global-scope="NanoBeauty.Button" variant="secondary" full-width="{{yes}}" on-click="{{keep}}">Keep editing</x-import><x-import component-from-global-scope="NanoBeauty.Button" variant="destructive" full-width="{{yes}}" on-click="{{discard}}">Discard</x-import></div></div></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "motion": {"editor": "enum", "options": ["normal", "reduced"], "default": "normal"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {

  componentWillUnmount() { (this._t || []).forEach(clearTimeout); if (this._i) clearInterval(this._i); }
  later(fn, ms) { this._t = this._t || []; this._t.push(setTimeout(fn, ms)); }
  reduced() { return (this.props.motion ?? 'normal') === 'reduced'; }
  // enter transition for a block that just appeared: start hidden, then settle
  reveal(key) { this.setState({ [key]: false }); this.later(() => this.setState({ [key]: true }), 30); }
  enterStyle(on, dur) {
    const r = this.reduced();
    const tr = r ? 'opacity var(--duration-reduced) linear' : `opacity var(--duration-${dur || 'reveal'}) var(--ease-enter), transform var(--duration-${dur || 'reveal'}) var(--ease-enter)`;
    const tf = r || on ? 'none' : 'translateY(8px)';
    return `opacity: ${on ? 1 : 0}; transform: ${tf}; transition: ${tr};`;
  }
  base() { return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, no: false, s16: 16, modeLabel: this.reduced() ? 'Reduce Motion on' : 'Normal motion' }; }

  constructor(props) { super(props); this.state = { mounted: false, shown: false, dirty: false, asking: false }; }
  open() { this.setState({ mounted: true, shown: false, dirty: false }); this.later(() => this.setState({ shown: true }), 30); }
  close() { this.setState({ shown: false, asking: false }); this.later(() => this.setState({ mounted: false }), this.reduced() ? 80 : 280); }
  renderVals() {
    const r = this.reduced(); const on = this.state.shown;
    const sheetTr = r ? 'opacity var(--duration-reduced) linear' : `transform var(--duration-overlay) ${on ? 'var(--ease-enter)' : 'var(--ease-exit)'}`;
    return { ...this.base(), mounted: this.state.mounted, asking: this.state.asking, noX: false,
      scrimStyle: `opacity: ${on ? 1 : 0}; transition: opacity var(--duration-${r ? 'reduced' : 'overlay'}) linear;`,
      sheetStyle: `transform: ${r || on ? 'none' : 'translateY(100%)'}; opacity: ${r && !on ? 0 : 1}; transition: ${sheetTr};`,
      open: () => this.open(), save: () => this.close(),
      typed: () => this.setState({ dirty: true }),
      scrimTap: () => { if (this.state.dirty) this.setState({ asking: true }); else this.close(); },
      keep: () => this.setState({ asking: false }), discard: () => this.close(), dlgStyle: this.enterStyle(true, 'overlay') };
  }
}
</script>
</body>
</html>
