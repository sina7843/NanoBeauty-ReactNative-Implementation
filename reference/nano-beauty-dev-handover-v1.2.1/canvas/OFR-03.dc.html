<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"state":{"editor":"enum","options":["ended","invalid","usedup","noteligible","alreadyused","valid"],"default":"ended"},"$preview":{"width":390,"height":844}}'>

}
