<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment: card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Card" back-label="Methods" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<p class="overline" style="margin: 0; color: var(--ink-muted);">Deposit</p>
<p class="display-md" style="margin: 0; color: var(--ink-display); font-variant-numeric: tabular-nums;">$50.00</p>
<p class="caption" style="margin: 0; color: var(--ink-muted);">12D HIFU · Thu 16 Oct, 2:30 pm</p>
</div>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Card number" icon="credit-card" value="{{num}}" input-mode="numeric" error="{{numError}}"></x-import>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<x-import component-from-global-scope="NanoBeauty.TextField" label="Expiry" value="{{exp}}" placeholder="MM / YY" input-mode="numeric"></x-import>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Security code" value="{{cvc}}" placeholder="3 digits" input-mode="numeric"></x-import>
</div>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Postal code" value="{{postal}}" placeholder="V3M 0A1"></x-import>
<sc-if value="{{state_verify}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.Banner" tone="info" title="Confirm with your bank">Your bank opened a check to confirm it’s you. Finish it there; we’ll wait here.</x-import>
</sc-if>
<sc-if value="{{notVerify}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 8px; align-items: center; color: var(--ink-muted); align-items: flex-start;">
<x-import component-from-global-scope="NanoBeauty.Icon" name="lock" size="{{s16}}"></x-import><p class="caption" style="margin: 0;">Payments are processed securely by [payment provider]. Nano Beauty never sees your full card number.</p>
</div>
</sc-if>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="PAY-04.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" icon="lock" loading="{{busy}}" loading-label="Paying…" disabled="{{notReady}}" full-width="{{yes}}">{{payLabel}}</x-import></a>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "state": {"editor": "enum", "options": ["filled", "empty", "error", "verify"], "default": "filled"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'filled';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, state, state_filled: state === 'filled', state_empty: state === 'empty', state_error: state === 'error', state_verify: state === 'verify', s16: 16, notVerify: state !== 'verify', busy: state === 'verify', notReady: state === 'empty', payLabel: 'Pay $50.00', num: state === 'empty' ? '' : (state === 'error' ? '4242 4242 4242' : '4242 4242 4242 4242'), numError: state === 'error' ? 'The card number is too short' : undefined, exp: state === 'empty' ? '' : '08 / 28', cvc: state === 'empty' ? '' : '•••', postal: state === 'empty' ? '' : 'V3M 0A1' };
}
}
</script>
</body>
</html>
