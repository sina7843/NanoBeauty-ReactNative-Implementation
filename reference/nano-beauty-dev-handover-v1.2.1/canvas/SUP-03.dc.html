<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact with reference</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Get help" back-label="Visit" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 24px;">
<x-import component-from-global-scope="NanoBeauty.SupportContext" topic="this visit" reference="NB-20418" hours="[Clinic hours to confirm]" response="Replies within 1 business day"></x-import>
<sc-if value="{{state_closed}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.Banner" tone="info" title="The clinic is closed now">Texts sent after hours are answered the next business morning.</x-import>
</sc-if>
<sc-if value="{{state_open}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.Banner" tone="success" title="The clinic is open now">Usually replies within an hour during clinic hours.</x-import>
</sc-if>
<sc-if value="{{state_sent}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.Toast" tone="success">Message sent with reference NB-20418. We’ll reply by text.</x-import>
</sc-if>
</div>
<div style="height: 34px; flex-shrink: 0;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"state":{"editor": "enum", "options": ["closed", "open", "sent"], "default": "closed"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'closed';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', state, state_closed: state === 'closed', state_open: state === 'open', state_sent: state === 'sent' };
}
}
</script>
</body>
</html>
