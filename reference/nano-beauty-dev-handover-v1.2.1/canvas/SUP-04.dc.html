<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SUP-04 Ask us</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">

</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}

</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Ask us" back-label="Help" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 8px 20px 12px;">
<h1 class="title-md" style="margin: 0; color: var(--ink-display);">Ask us about a treatment</h1>
<p class="caption" style="margin: 0; color: var(--ink-muted);">A specialist replies within 1 business day. This isn’t for urgent medical questions.</p>
<p class="label" style="margin: 0;">What would you like help with?</p>
<div style="display: flex; gap: 6px; flex-wrap: wrap;"><x-import component-from-global-scope="NanoBeauty.Chip" selected="{{yes}}">Unwanted hair</x-import><x-import component-from-global-scope="NanoBeauty.Chip">Skin tightening</x-import><x-import component-from-global-scope="NanoBeauty.Chip">Pigmentation</x-import><x-import component-from-global-scope="NanoBeauty.Chip">Acne and scars</x-import><x-import component-from-global-scope="NanoBeauty.Chip">Something else</x-import></div>
<p class="label" style="margin: 0;">How should we reply?</p>
<x-import component-from-global-scope="NanoBeauty.SegmentedControl" label="Reply by" options="{{ch}}" value="Text"></x-import>
<sc-if value="{{not_state_error}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.TextField" label="Your question" value="{{msg}}" placeholder="For example: is laser OK for tanned skin?"></x-import>
</sc-if>
<sc-if value="{{state_error}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.TextField" label="Your question" value="" error="Add a short question so we can help"></x-import>
</sc-if>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-if value="{{not_state_sending}}" hint-placeholder-val="{{true}}">
<a href="SUP-05.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}">Send question</x-import></a>
</sc-if><sc-if value="{{state_sending}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}" loading="{{yes}}" loading-label="Sending">Send question</x-import>
</sc-if>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "state": {"editor": "enum", "options": ["empty", "filled", "error", "sending"], "default": "filled"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'filled';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, state, state_empty: state === 'empty', not_state_empty: state !== 'empty', state_filled: state === 'filled', not_state_filled: state !== 'filled', state_error: state === 'error', not_state_error: state !== 'error', state_sending: state === 'sending', not_state_sending: state !== 'sending', ch: ['Text', 'Email', 'In app'], msg: (this.props.state ?? 'filled') === 'empty' ? '' : 'I was in the sun last week. Can I still have laser on my legs?' };
}
}
</script>
</body>
</html>
