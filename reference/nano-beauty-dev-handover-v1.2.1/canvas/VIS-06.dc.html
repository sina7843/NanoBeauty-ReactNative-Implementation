<!doctype html>

<x-dc>
<helmet>

<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px;">
<h1 class="title-lg" style="margin: 0; color: var(--ink-display);">Your visit is less than 48 hours away</h1>

<x-import component-from-global-scope="NanoBeauty.ListGroup"><x-import component-from-global-scope="NanoBeauty.ListRow" icon="calendar-x" title="If you cancel now" subtitle="Your $50 deposit becomes clinic credit" chevron="{{no}}"></x-import>

<x-import component-from-global-scope="NanoBeauty.SupportContext" topic="this visit" reference="NB-20418" hours="[Clinic hours to confirm]" response="Replies within 1 business day"></x-import>

<div style="height: 34px; flex-shrink: 0;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, no: false };
}
}
</script>
