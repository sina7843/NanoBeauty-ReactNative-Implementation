<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Past visit</title>

<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Visit" back-label="Visits" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px;">
<x-import component-from-global-scope="NanoBeauty.AppointmentPass" service="Laser Hair Removal" date="Thu 28 Aug" time="11:00 am" provider="Anna" status="{{status}}" sample="{{yes}}" eyebrow="Past visit"></x-import>
<sc-if value="{{state_missed}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.Banner" tone="warning" title="You missed this visit">This visit was missed, so the $50 deposit was kept under the booking policy. Questions? Contact the clinic.</x-import>
</sc-if>
<x-import component-from-global-scope="NanoBeauty.ListGroup"><a href="CAR-01.dc.html" style="text-decoration: none; display: block;"><x-import component-from-global-scope="NanoBeauty.ListRow" icon="first-aid-kit" title="Aftercare" subtitle="What to do in the days after"></x-import></a>
<a href="PAY-09.dc.html" style="text-decoration: none; display: block;"><x-import component-from-global-scope="NanoBeauty.ListRow" icon="receipt" title="Receipt" value="$70.00"></x-import></a>
<a href="SUP-03.dc.html" style="text-decoration: none; display: block;"><x-import component-from-global-scope="NanoBeauty.ListRow" icon="question" title="Get help with this visit" subtitle="Reference NB-19877"></x-import></a></x-import>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="BKG-03.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" icon="calendar-plus" full-width="{{yes}}">Book again</x-import></a>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "state": {"editor": "enum", "options": ["completed", "missed"], "default": "completed"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'completed';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, state, state_completed: state === 'completed', state_missed: state === 'missed', status: state === 'missed' ? 'noshow' : 'completed' };
}
}
</script>
</body>
</html>
