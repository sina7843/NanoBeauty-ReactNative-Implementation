<x-dc>
<helmet>
<style>

<x-import component-from-global-scope="NanoBeauty.CreditRow" available="{{credit}}" source="a late cancellation" expires="{{expires}}" reconciling="{{recon}}" sample="{{yes}}"></x-import>
<sc-if value="{{state_expiring}}" hint-placeholder-val="{{true}}">

<a href="WAL-12.dc.html" style="text-decoration: none;"><p class="caption" style="margin: 0; color: var(--primary); font-weight: 600;">Something’s wrong with my balance</p></a>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="BKG-01.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}">Book and use my credit</x-import></a>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "state": {"editor": "enum", "options": ["available", "expiring", "reconciling"], "default": "available"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'available';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, state, state_available: state === 'available', state_expiring: state === 'expiring', state_reconciling: state === 'reconciling', no: false, credit: 40, recon: state === 'reconciling', expires: state === 'expiring' ? '31 Oct 2026' : '12 May 2027' };
}
}
</script>
