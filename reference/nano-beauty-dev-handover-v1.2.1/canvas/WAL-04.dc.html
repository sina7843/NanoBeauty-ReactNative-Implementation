<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gift card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Gift card" back-label="Wallet" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px;">
<sc-if value="{{role_mine}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.GiftCard" balance="{{bal}}" sample="{{yes}}"></x-import>
</sc-if>
<sc-if value="{{role_sent}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.GiftCard" amount="{{amt}}" recipient="Sara" status="{{gstatus}}" code="Sent by text" sample="{{yes}}"></x-import>
</sc-if>
<sc-if value="{{role_mine}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.ListGroup" header="History"><x-import component-from-global-scope="NanoBeauty.ListRow" icon="minus" title="Used at your visit" subtitle="12 Sep · NB-19877" value="−$20" chevron="{{no}}"></x-import>
<x-import component-from-global-scope="NanoBeauty.ListRow" icon="plus" title="Brought over from the old app" subtitle="1 Sep" value="+$115" chevron="{{no}}"></x-import></x-import>
</sc-if>
<sc-if value="{{role_mine}}" hint-placeholder-val="{{true}}">
<p class="caption" style="margin: 0; color: var(--ink-muted);">No expiry. Use it for any treatment at Nano Beauty; it can’t be exchanged for cash.</p>
</sc-if>
<sc-if value="{{role_sent}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.ListGroup"><x-import component-from-global-scope="NanoBeauty.ListRow" icon="clock" title="Sends" subtitle="Wed 24 Dec, 9:00 am PT" chevron="{{no}}"></x-import>
<x-import component-from-global-scope="NanoBeauty.ListRow" icon="chat-circle-text" title="To" subtitle="Sara · (604) •••-••57" chevron="{{no}}"></x-import>
<a href="PAY-09.dc.html" style="text-decoration: none; display: block;"><x-import component-from-global-scope="NanoBeauty.ListRow" icon="receipt" title="Receipt" value="$100.00"></x-import></a></x-import>
</sc-if>
<sc-if value="{{role_sent}}" hint-placeholder-val="{{true}}">
<p class="caption" style="margin: 0; color: var(--ink-muted);">Until it’s claimed, you can change the send time or resend it.</p>
</sc-if>
<a href="WAL-12.dc.html" style="text-decoration: none;"><p class="caption" style="margin: 0; color: var(--primary); font-weight: 600;">Something’s wrong with this gift card</p></a>
</div>
<sc-if value="{{role_mine}}" hint-placeholder-val="{{true}}">
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="BKG-01.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}">Book and use it</x-import></a>
</div>
<div style="height: 34px;"></div>
</div>
</sc-if>
<sc-if value="{{role_sent}}" hint-placeholder-val="{{true}}">
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<x-import component-from-global-scope="NanoBeauty.Button" variant="secondary" full-width="{{yes}}">Change send time</x-import>
<x-import component-from-global-scope="NanoBeauty.Button" variant="secondary" icon="paper-plane-tilt" full-width="{{yes}}">Resend</x-import>
</div>
<div style="height: 34px;"></div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "role": {"editor": "enum", "options": ["mine", "sent"], "default": "mine"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const role = this.props.role ?? 'mine';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, role, role_mine: role === 'mine', role_sent: role === 'sent', no: false, bal: 95, amt: 100, gstatus: 'scheduled' };
}
}
</script>
</body>
</html>
