<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gift card: recipient</title>

<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">

</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Send a gift card" back-label="Value" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px;">
<x-import component-from-global-scope="NanoBeauty.BookingStepper" steps="{{giftSteps}}" current="{{step}}"></x-import>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Their name" value="Sara"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<p class="label" style="margin: 0;">Send it by</p>
<x-import component-from-global-scope="NanoBeauty.SegmentedControl" label="Send it by" options="{{by}}" value="Text"></x-import>
</div>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Their mobile number" icon="phone" value="(604) 555-0157" input-mode="tel"></x-import>
<x-import component-from-global-scope="NanoBeauty.TextField" label="Message" optional="{{yes}}" value="Happy birthday! Treat yourself."></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<p class="label" style="margin: 0;">When</p>
<x-import component-from-global-scope="NanoBeauty.SegmentedControl" label="When" options="{{when}}" value="{{whenVal}}"></x-import>
</div>
<sc-if value="{{state_later}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.TextField" label="Send on" icon="calendar-blank" value="Wed 24 Dec, 9:00 am PT"></x-import>
</sc-if>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="WAL-10.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}">Review</x-import></a>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "state": {"editor": "enum", "options": ["now", "later"], "default": "now"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'now';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, state, state_now: state === 'now', state_later: state === 'later', giftSteps: ['Design', 'Value', 'Recipient', 'Review'], step: 2, by: ['Text', 'Email'], when: ['Send now', 'Schedule'], whenVal: state === 'later' ? 'Schedule' : 'Send now' };
}
}
</script>
</body>
