<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WAL-13 Gift design</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nanobeauty/tokens.css">
<link rel="stylesheet" href="ds/nanobeauty/components/bundle.css">
<script src="ds/nanobeauty/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Fraunces';src:url(/_blob/6f18d9d1ccc0c664645e2a614e4b6be5) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url(/_blob/9ef31c49535b7a4ffde4997ba7372961) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Sora';src:url(/_blob/601fcfea98cab2239ee0b0c09edf077e) format('woff2');font-weight:100 800;font-style:normal}
body{margin:0}
a[href]{color:inherit}
a[href] *{pointer-events:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="height: 54px; flex-shrink: 0;"></div>
<x-import component-from-global-scope="NanoBeauty.TopBar" title="Send a gift" back-label="Wallet" platform="{{platform}}"></x-import>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 12px;">
<x-import component-from-global-scope="NanoBeauty.BookingStepper" steps="{{steps}}" current="{{zero}}"></x-import>
<h1 class="title-md" style="margin: 0; color: var(--ink-display);">Pick a design</h1>
<p class="body" style="margin: 0; color: var(--ink-muted);">The recipient sees it on their card and in the text or email we send.</p>
<x-import component-from-global-scope="NanoBeauty.GiftDesignPicker" designs="{{designs}}" selected="{{sel}}" loading="{{loading}}"></x-import>
<sc-if value="{{state_selected}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="NanoBeauty.GiftCard" amount="{{hundred}}" recipient="Sara" status="payment" sample="{{yes}}"></x-import>
</sc-if>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--line);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="WAL-08.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="NanoBeauty.Button" size="lg" full-width="{{yes}}" disabled="{{loading}}">Continue</x-import></a>
</div>
<div style="height: 34px;"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "platform": {"editor": "enum", "options": ["ios", "android"], "default": "ios"}, "state": {"editor": "enum", "options": ["selected", "loading"], "default": "selected"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const state = this.props.state ?? 'selected';
return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'ios', yes: true, state, state_selected: state === 'selected', not_state_selected: state !== 'selected', state_loading: state === 'loading', not_state_loading: state !== 'loading', zero: 0, hundred: 100, steps: ['Design', 'Value', 'Recipient', 'Review'], loading: (this.props.state ?? 'selected') === 'loading', sel: (this.props.state ?? 'selected') === 'loading' ? '' : 'birthday', designs: [{key: 'thanks', name: 'Thank you'}, {key: 'birthday', name: 'Birthday'}, {key: 'holiday', name: 'Holidays'}, {key: 'love', name: 'With love'}] };
}
}
</script>
</body>
</html>
